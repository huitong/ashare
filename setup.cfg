[metadata]
name = ashare-quant
version = 0.1.0
description = A-share daily research, recall, ranking, and backtesting

[options]
packages = find:
python_requires = >=3.9
install_requires =
    numpy>=1.24
    pandas>=1.5
    torch>=2.1

[options.packages.find]
include = ashare*

[options.package_data]
ashare = schema.sql, web_assets/*

[options.entry_points]
console_scripts =
    ashare = ashare.cli:main

[options.extras_require]
futu =
    futu-api>=10
